<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizarofay</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #151520;
            --bg-elevated: #1a1a28;
            --bg-card: #14141e;
            --text-primary: #f0ece4;
            --text-secondary: #b0b0ba;
            --text-muted: #6a6a7a;
            --accent: #c9a06c;
            --accent-hover: #d4b080;
            --danger: #8b2500;
            --border: #2a2a3a;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 10px;
            transition: background 0.3s, color 0.3s;
        }

        body.light {
            --bg-primary: #f0ece4;
            --bg-secondary: #e8ddd0;
            --bg-elevated: #fcf8f2;
            --bg-card: #fcf8f2;
            --text-primary: #1a0f0a;
            --text-secondary: #3d2b1f;
            --text-muted: #7a6a5a;
            --accent: #8b2500;
            --accent-hover: #6b1a00;
            --border: #c9bcaa;
        }

        .app {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            grid-template-areas: 
                "sidebar main"
                "player player";
            gap: 10px;
            height: calc(100vh - 20px);
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .sidebar {
            grid-area: sidebar;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            transition: background 0.3s;
        }

        .sidebar-logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo span {
            color: var(--accent);
            font-style: italic;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--bg-elevated);
            color: var(--accent);
        }

        .sidebar-section h3 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .artists-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .artist-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .artist-link:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        /* ОСНОВНАЯ ОБЛАСТЬ */
        .main {
            grid-area: main;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s;
        }

        .main-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 10px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.15s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .theme-toggle:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* СТРАНИЦА АРТИСТА */
        .artist-header {
            position: relative;
            height: 240px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            background: var(--bg-card);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 30px;
        }

        .artist-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }

        .artist-info {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .artist-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            background: var(--bg-primary);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--text-muted);
        }

        .artist-name {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: #f0ece4;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .artist-stats {
            font-size: 13px;
            color: #b0b0ba;
            margin-top: 4px;
        }

        /* СЕКЦИИ */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .album-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .album-card:hover {
            background: var(--bg-elevated);
            transform: translateY(-2px);
            border-color: var(--border);
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            background: var(--bg-primary);
            background-size: cover;
            background-position: center;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--text-muted);
        }

        .album-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .album-year {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ТРЕКИ */
        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .track-item {
            display: grid;
            grid-template-columns: 40px 1fr 80px 60px;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
            align-items: center;
        }

        .track-item:hover {
            background: var(--bg-card);
        }

        .track-number {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        .track-title {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .track-item.playing .track-title {
            color: var(--accent);
        }

        .track-duration {
            color: var(--text-muted);
            font-size: 13px;
            text-align: right;
        }

        /* ТЕКСТ ПЕСНИ */
        .lyrics-box {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'PT Serif', serif;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-line;
            display: none;
            border: 1px solid var(--border);
        }

        .lyrics-box.active {
            display: block;
        }

        /* ПЛЕЕР */
        .player {
            grid-area: player;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 12px 24px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            align-items: center;
            transition: background 0.3s;
        }

        .player-track {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-cover {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text-muted);
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-artist {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .player-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.15s;
        }

        .player-btn:hover {
            background: var(--bg-card);
        }

        .player-btn-play {
            background: var(--accent);
            color: var(--bg-primary);
            width: 48px;
            height: 48px;
            font-size: 18px;
        }

        .player-btn-play:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .player-progress {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .player-progress input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .player-progress input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
            grid-column: 3 / 4;
        }

        .player-volume input[type="range"] {
            width: 100px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* ПУСТОЕ СОСТОЯНИЕ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 14px;
            max-width: 400px;
            line-height: 1.6;
        }

        /* СКРОЛЛ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr 90px;
                grid-template-areas: 
                    "sidebar"
                    "main"
                    "player";
                height: auto;
            }
            .sidebar {
                max-height: 200px;
            }
            .artist-name {
                font-size: 32px;
            }
            .player {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .player-volume {
                grid-column: 1 / -1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <aside class="sidebar">
            <div class="sidebar-logo">🎵 <span>Bizarofay</span></div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="home">🏠 Главная</a>
                <a href="#" class="nav-item" data-page="search">🔍 Поиск</a>
                <a href="#" class="nav-item" data-page="library">📚 Медиатека</a>
            </nav>
            <div class="sidebar-section">
                <h3>Артисты</h3>
                <div id="artistsList" class="artists-list"></div>
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <main class="main">
            <header class="main-header">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск треков, артистов, альбомов...">
                </div>
                <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌓</button>
            </header>

            <div class="main-content" id="mainContent">
                <!-- Здесь будет динамический контент -->
            </div>
        </main>

        <!-- ПЛЕЕР -->
        <footer class="player" id="player">
            <div class="player-track" id="playerTrack">
                <div class="player-cover" id="playerCover">🎵</div>
                <div class="player-info">
                    <div class="player-title" id="playerTitle">Ничего не играет</div>
                    <div class="player-artist" id="playerArtist">—</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="prevBtn">⏮</button>
                <button class="player-btn player-btn-play" id="playBtn">▶</button>
                <button class="player-btn" id="nextBtn">⏭</button>
            </div>
            <div class="player-progress">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0">
                <span id="totalTime">0:00</span>
            </div>
            <div class="player-volume">
                <span>🔊</span>
                <input type="range" id="volumeBar" min="0" max="100" value="80">
            </div>
        </footer>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        (function() {
            'use strict';

            // ===== ТЕМА =====
            const themeToggle = document.getElementById('themeToggle');
            let theme = localStorage.getItem('bizarofay_theme') || 'dark';
            
            function applyTheme() {
                if (theme === 'light') {
                    document.body.classList.add('light');
                    themeToggle.textContent = '☀️';
                } else {
                    document.body.classList.remove('light');
                    themeToggle.textContent = '🌓';
                }
            }
            
            themeToggle.addEventListener('click', function() {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('bizarofay_theme', theme);
                applyTheme();
            });
            
            applyTheme();

            // ===== СОСТОЯНИЕ =====
            let playlist = [];
            let currentIndex = -1;
            let isPlaying = false;
            let currentArtist = null;
            let currentAlbum = null;

            // ===== ЭЛЕМЕНТЫ =====
            const audio = document.getElementById('audio');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressBar = document.getElementById('progressBar');
            const volumeBar = document.getElementById('volumeBar');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const playerTitle = document.getElementById('playerTitle');
            const playerArtist = document.getElementById('playerArtist');
            const playerCover = document.getElementById('playerCover');
            const mainContent = document.getElementById('mainContent');
            const artistsList = document.getElementById('artistsList');
            const searchInput = document.getElementById('searchInput');

            // ===== ДАННЫЕ АРТИСТОВ =====
            const ARTISTS = [
                {
                    id: 'Bizarre',
                    name: 'Bizarre',
                    avatar: 'music/artists/Bizarre/avatar.jpg',
                    banner: 'music/artists/Bizarre/banner.jpg',
                    albums: [
                        {
                            id: '2024_First_Album',
                            title: 'First Album',
                            year: 2024,
                            cover: 'music/artists/Bizarre/albums/2024_First_Album/cover.jpg',
                            tracks: [
                                {
                                    file: 'music/artists/Bizarre/albums/2024_First_Album/01_Intro.mp3',
                                    lyrics: 'music/artists/Bizarre/albums/2024_First_Album/01_Intro.txt',
                                    title: 'Intro'
                                },
                                {
                                    file: 'music/artists/Bizarre/albums/2024_First_Album/02_King.mp3',
                                    lyrics: 'music/artists/Bizarre/albums/2024_First_Album/02_King.txt',
                                    title: 'King'
                                }
                            ]
                        }
                    ]
                }
            ];

            // ===== ФУНКЦИИ =====
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return min + ':' + (sec < 10 ? '0' : '') + sec;
            }

            function showEmptyState(title, text) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎵</div>
                        <div class="empty-state-title">${title}</div>
                        <div class="empty-state-text">${text}</div>
                    </div>
                `;
            }

            // ===== ГЛАВНАЯ =====
            function showHome() {
                if (ARTISTS.length === 0) {
                    showEmptyState('Нет артистов', 'Добавьте артистов в папку music/artists/');
                    return;
                }

                let html = '<h2 class="section-title">Артисты</h2>';
                html += '<div class="albums-grid">';

                for (const artist of ARTISTS) {
                    html += `
                        <div class="album-card" onclick="window.bizarofay.openArtist('${artist.id}')">
                            <div class="album-cover" style="background-image: url('${artist.avatar}')">🎤</div>
                            <div class="album-title">${artist.name}</div>
                            <div class="album-year">${artist.albums.length} альбомов</div>
                        </div>
                    `;
                }

                html += '</div>';
                mainContent.innerHTML = html;
            }

            // ===== СТРАНИЦА АРТИСТА =====
            function openArtist(artistId) {
                const artist = ARTISTS.find(a => a.id === artistId);
                if (!artist) return;

                currentArtist = artist;

                let html = `
                    <div class="artist-header" style="background-image: url('${artist.banner}')">
                        <div class="artist-info">
                            <div class="artist-avatar" style="background-image: url('${artist.avatar}')">🎤</div>
                            <div>
                                <div class="artist-name">${artist.name}</div>
                                <div class="artist-stats">${artist.albums.length} альбомов</div>
                            </div>
                        </div>
                    </div>
                `;

                for (const album of artist.albums) {
                    html += `
                        <h2 class="section-title">${album.title} <span style="font-size: 16px; color: var(--text-muted); font-weight: 400;">(${album.year})</span></h2>
                        <div class="tracks-list">
                    `;

                    for (let i = 0; i < album.tracks.length; i++) {
                        const track = album.tracks[i];
                        html += `
                            <div class="track-item" 
                                 data-artist="${artist.id}" 
                                 data-album="${album.id}" 
                                 data-index="${i}"
                                 onclick="window.bizarofay.playTrack('${artist.id}', '${album.id}', ${i})">
                                <div class="track-number">${i + 1}</div>
                                <div class="track-title">${track.title}</div>
                                <div class="track-duration">—</div>
                                <div></div>
                            </div>
                        `;
                    }

                    html += '</div>';
                }

                mainContent.innerHTML = html;
            }

            // ===== ВОСПРОИЗВЕДЕНИЕ =====
            function playTrack(artistId, albumId, trackIndex) {
                const artist = ARTISTS.find(a => a.id === artistId);
                if (!artist) return;
                const album = artist.albums.find(al => al.id === albumId);
                if (!album) return;

                playlist = album.tracks.map((t, i) => ({
                    ...t,
                    artist: artist.name,
                    album: album.title,
                    cover: album.cover,
                    artistId: artist.id,
                    albumId: album.id,
                    index: i
                }));

                currentIndex = trackIndex;
                currentAlbum = album;
                loadTrack();
                play();
            }

            function loadTrack() {
                if (currentIndex < 0 || currentIndex >= playlist.length) return;
                const track = playlist[currentIndex];
                
                audio.src = track.file;
                
                playerTitle.textContent = track.title;
                playerArtist.textContent = track.artist + ' — ' + track.album;
                playerCover.style.backgroundImage = `url('${track.cover}')`;
                playerCover.textContent = '';

                showLyrics(track);
            }

            function showLyrics(track) {
                const oldLyrics = mainContent.querySelector('.lyrics-box');
                if (oldLyrics) oldLyrics.remove();

                if (!track.lyrics) return;

                fetch(track.lyrics)
                    .then(r => r.ok ? r.text() : null)
                    .then(text => {
                        if (!text) return;
                        const box = document.createElement('div');
                        box.className = 'lyrics-box active';
                        box.textContent = text;
                        mainContent.appendChild(box);
                    })
                    .catch(() => {});
            }

            function play() {
                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    highlightTrack();
                }).catch(err => console.warn('Ошибка воспроизведения:', err));
            }

            function pause() {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }

            function togglePlay() {
                if (playlist.length === 0) return;
                if (isPlaying) pause();
                else play();
            }

            function next() {
                if (playlist.length === 0) return;
                currentIndex = (currentIndex + 1) % playlist.length;
                loadTrack();
                play();
            }

            function prev() {
                if (playlist.length === 0) return;
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack();
                play();
            }

            function highlightTrack() {
                document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
                const track = playlist[currentIndex];
                if (!track) return;
                const el = document.querySelector(`.track-item[data-artist="${track.artistId}"][data-album="${track.albumId}"][data-index="${track.index}"]`);
                if (el) el.classList.add('playing');
            }

            // ===== ПЛЕЕР =====
            playBtn.addEventListener('click', togglePlay);
            nextBtn.addEventListener('click', next);
            prevBtn.addEventListener('click', prev);

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    progressBar.value = (audio.currentTime / audio.duration) * 100;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('ended', next);

            progressBar.addEventListener('input', () => {
                if (audio.duration) {
                    audio.currentTime = (progressBar.value / 100) * audio.duration;
                }
            });

            volumeBar.addEventListener('input', () => {
                audio.volume = volumeBar.value / 100;
            });

            audio.volume = 0.8;

            // ===== СПИСОК АРТИСТОВ В САЙДБАРЕ =====
            function renderArtistsList() {
                artistsList.innerHTML = '';
                for (const artist of ARTISTS) {
                    const link = document.createElement('div');
                    link.className = 'artist-link';
                    link.textContent = artist.name;
                    link.onclick = () => openArtist(artist.id);
                    artistsList.appendChild(link);
                }
            }

            // ===== ПОИСК =====
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                if (!query) {
                    showHome();
                    return;
                }

                let results = [];
                for (const artist of ARTISTS) {
                    for (const album of artist.albums) {
                        for (const track of album.tracks) {
                            if (track.title.toLowerCase().includes(query) ||
                                artist.name.toLowerCase().includes(query) ||
                                album.title.toLowerCase().includes(query)) {
                                results.push({ artist, album, track });
                            }
                        }
                    }
                }

                if (results.length === 0) {
                    showEmptyState('Ничего не найдено', `По запросу "${query}" ничего не найдено`);
                    return;
                }

                let html = '<h2 class="section-title">Результаты поиска</h2>';
                html += '<div class="tracks-list">';
                for (const r of results) {
                    html += `
                        <div class="track-item" onclick="window.bizarofay.playTrack('${r.artist.id}', '${r.album.id}', ${r.album.tracks.indexOf(r.track)})">
                            <div class="track-number">▶</div>
                            <div class="track-title">${r.track.title}</div>
                            <div class="track-duration">${r.artist.name}</div>
                            <div></div>
                        </div>
                    `;
                }
                html += '</div>';
                mainContent.innerHTML = html;
            });

            // ===== НАВИГАЦИЯ =====
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');

                    const page = this.dataset.page;
                    if (page === 'home') showHome();
                    else if (page === 'search') showEmptyState('Поиск', 'Введите запрос в строке поиска');
                    else if (page === 'library') showEmptyState('Медиатека', 'Здесь будут ваши лайки и плейлисты');
                });
            });

            // ===== ЭКСПОРТ =====
            window.bizarofay = {
                openArtist,
                playTrack,
                play,
                pause,
                next,
                prev
            };

            // ===== СТАРТ =====
            renderArtistsList();
            showHome();

            console.log('🎵 Bizarofay загружен!');
            console.log('📀 Артистов:', ARTISTS.length);
            console.log('💿 Альбомов:', ARTISTS.reduce((s, a) => s + a.albums.length, 0));
            console.log('🎵 Треков:', ARTISTS.reduce((s, a) => s + a.albums.reduce((s2, al) => s2 + al.tracks.length, 0), 0));
        })();
    </script>
</body>
</html>
